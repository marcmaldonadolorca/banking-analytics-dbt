name: dbt build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the raw download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: uci-350-${{ hashFiles('scripts/load_raw.py') }}

      - name: Load raw data into DuckDB
        run: python scripts/load_raw.py

      - name: dbt build (seeds, models, data tests, unit tests)
        run: dbt build

      - name: Incremental run (merges the latest month again)
        run: dbt build --select fct_card_statements+

      - name: dbt docs generate
        run: dbt docs generate
